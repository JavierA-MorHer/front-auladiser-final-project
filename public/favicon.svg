<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="100" height="100" rx="20" fill="url(#grad1)"/>
  
  <!-- Gráfica de líneas ascendente -->
  <polyline 
    points="15,70 30,60 45,45 60,35 75,25 85,20" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
  
  <!-- Puntos en la gráfica -->
  <circle cx="15" cy="70" r="3" fill="#ffffff"/>
  <circle cx="30" cy="60" r="3" fill="#ffffff"/>
  <circle cx="45" cy="45" r="3" fill="#ffffff"/>
  <circle cx="60" cy="35" r="3" fill="#ffffff"/>
  <circle cx="75" cy="25" r="3" fill="#ffffff"/>
  <circle cx="85" cy="20" r="4" fill="#ffffff"/>
  
  <!-- Línea de tendencia ascendente (flecha sutil) -->
  <path 
    d="M 80 25 L 88 17 M 80 25 L 88 33" 
    stroke="#ffffff" 
    stroke-width="2.5" 
    stroke-linecap="round"
    opacity="0.8"
  />
</svg>

